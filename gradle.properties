org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

mod_id=riftfall
mod_name=Riftfall Core
# Code only. The bundled audio is under a separate licence and is not AGPL: see LICENSE-AUDIO.md.
mod_license=AGPL-3.0-or-later (code); bundled audio separately licensed, see LICENSE-AUDIO.md
mod_version=0.1.1
mod_group_id=com.cyberday1.riftfall
mod_authors=CyberDay1
mod_description=Core mod for the Riftfall modpack: classes, progression, and procedural rift dungeons.
# deps.*_jar are file names in the pack's mods folder. Set riftfall.instanceMods to that folder in
# ~/.gradle/gradle.properties to compile against it; without it the build uses the deps.*_maven lines.
deps.customnpcs_jar=CustomNPCs-Unofficial-NeoForge-1.21.1.20251230.jar

deps.neoforge=21.1.265
# Curios, compile-only. The equipment slots it adds live outside Inventory, so a rift death has to be
# told about them; nothing here loads a Curios class unless the mod is actually present.
deps.curios=9.5.1+1.21.1
# Accessories, compile-only, and there for the same reason as Curios: it is the other place equipment
# lives outside Inventory, and it is a separate mod rather than a Curios front end, so being told
# about one says nothing about the other.
deps.accessories=1.1.0-beta.54+1.21.1
# Optional UI compatibility, compile-only; never bundled in Riftfall.
deps.owo_jar=owo-lib-neoforge-0.12.15.6-beta.1+1.21.jar
# Apotheosis and its library Placebo, compile-only and on the same terms. Riftfall already rewrites
# all 234 affixes and all five rarities as datapack overrides; the one thing a datapack cannot say is
# that a piece of gear's rarity should follow the tier of the rift it dropped in, and that is all the
# Java here is for. Placebo is on the list because Apotheosis' registries extend its types, so javac
# cannot resolve them without it.
deps.apotheosis=1.21.1-8.9.0
deps.placebo=1.21.1-9.9.4
# Apothic Attributes, the third of the set: the equipment-slot registries a LootCategory is built
# out of live here, not in Apotheosis, so the trinket category needs it to compile.
deps.apothic_attributes=1.21.1-2.11.0
# Spell Engine, compile-only, and the first mod Riftfall compiles against in order to *call* rather
# than to read. A skill node has to invoke something, and this is the one ability engine in the pack
# whose abilities are datapack JSON. The loader is in the version string, so unlike Accessories there
# is no Fabric/NeoForge ambiguity to resolve.
deps.spell_engine=1.10.9+1.21.1-neoforge
# Spell Power, compile-only: RiftSpellEngine computes a cast's power itself on 1.10. The floor Spell
# Engine 1.10.8 declares, and the version the pack runs.
deps.spell_power=1.6.0+1.21.1-neoforge
# Iron's Spells 'n Spellbooks, compile-only: the ability gate's Iron's mixins name its cast methods.
# The version the pack runs.
deps.irons_spellbooks=1.21.1-3.16.3
# Woodwalkers (modid walkers) and its library CraftedCore, compile-only and NOT vendored: the build reads
# the jars the pack instance already has. The Shifter's forms wear a Woodwalkers model through its API
# (compat.WalkersShapes), and ShapeEvents' callbacks are CraftedCore types, so both must be on the
# classpath.
deps.walkers_jar=walkers-5.8.13.jar
deps.craftedcore_jar=craftedcore-5.8.3.jar
# TaCZ, the Gunner's guns (gunner-tacz.md). Compile-only, from the instance's own jar like Woodwalkers.
deps.tacz_jar=tacz-neoforge-1.21.1-1.2.0-hotfix.jar
deps.sophisticatedbackpacks_jar=sophisticatedbackpacks-1.21.1-3.26.23.2263.jar
# JEI, compile-only: only compat.jei names its types, and JEI alone loads the @JeiPlugin there.
deps.jei_jar=jei-1.21.1-neoforge-19.76.1.481.jar
deps.sophisticatedcore_jar=sophisticatedcore-1.21.1-1.5.42.2496.jar
minecraft_version=1.21.1
deps.bettercombat_jar=bettercombat-neoforge-2.4.0+1.21.1.jar
deps.playeranimator_jar=player-animation-lib-forge-2.0.4+1.21.1.jar
deps.openpac_jar=open-parties-and-claims-neoforge-1.21.1-0.33.0.jar
minecraft_version_range=[1.21.1,1.22)
# Floor matches our build dep so an older NeoForge can't load us into an API mismatch.
neo_version_range=[21.1.265,)
loader_version_range=[4,)
deps.ftblibrary_jar=ftb-library-neoforge-2101.1.40.jar
# The same jars as the deps.*_jar instance files above, for builds without riftfall.instanceMods (CI).
# Each names the byte-identical file (SHA-1 checked 11-24); bump it with its _jar line.
deps.ftblibrary_maven=curse.maven:ftb-library-404465:9650381
deps.bettercombat_maven=maven.modrinth:better-combat:VhIOvcXP
deps.playeranimator_maven=maven.modrinth:playeranimator:HJZB6bmA
deps.customnpcs_maven=curse.maven:customnpcs-unofficial-1052708:7411561
deps.openpac_maven=maven.modrinth:open-parties-and-claims:yWmXD7GW
deps.owo_maven=maven.modrinth:owo-lib:wbdHEItB
deps.walkers_maven=maven.modrinth:woodwalkers:k5PBmBwF
deps.craftedcore_maven=maven.modrinth:crafted-core:T4KaObAV
deps.tacz_maven=maven.modrinth:timeless-and-classics-zero:tJiZL0He
deps.sophisticatedbackpacks_maven=curse.maven:sophisticated-backpacks-422301:9758733
deps.sophisticatedcore_maven=curse.maven:sophisticated-core-618298:9758568
deps.jei_maven=maven.modrinth:jei:lDv3cHMp
