# Builds the release jar and keeps it as a workflow artifact. It never creates or publishes a
# GitHub Release: the token is read-only, so it cannot.
name: Release jar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # A v* tag has to name the version the jar carries, so the artifact matches the pack's jar by name.
      - name: Check the tag against mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version" >&2
            exit 1
          fi

      # Tests are skipped to save Actions minutes; they run locally before a release.
      # mavenDeps: the pack instance is not here, so its jars come from Modrinth and CurseMaven.
      # noAudio: the audio is never committed (LICENSE-AUDIO.md), so this jar ships without it.
      - name: Build
        run: ./gradlew build -x test -Priftfall.mavenDeps=true -Priftfall.noAudio=true --no-daemon

      - name: Record the jar's checksum
        run: sha256sum build/libs/*.jar | tee build/libs/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: riftfall-jar-${{ github.ref_name }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
